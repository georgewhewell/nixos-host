[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-quota-exporter"
version = "0.1.0"
description = "Prometheus exporter for LLM subscription usage and quota windows (Anthropic, OpenAI/Codex, Gemini, Grok, Kimi)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "prometheus-client>=0.19",
  "httpx>=0.27",
]

[project.scripts]
llm-quota-exporter = "llm_quota_exporter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_quota_exporter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
