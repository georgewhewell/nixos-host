[package]
name = "pexctl"
version = "0.1.0"
edition = "2021"
description = "Open command-line tooling for Broadcom/PLX PEX switch configuration"
license = "MIT"
repository = "https://github.com/robcohen/nixos-config"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
