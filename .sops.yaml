  - &strix-4 age1xn4v4pxxvs2mtphvd0wy95qde0q7cuvj4nht8gt7y7wnmhd2nusss7h9en  # strix-4
  - &rock-5b age10zjqq6aevnwg9xkmpeq40u9utx8k09gw5r4qkrkvrc9hmjdv8szqre99zq  # rock-5b (192.168.23.18)
  - &k3 age1kkmcu5p7m29ecutynunv4js4w2t9zckrnys5svhzwyxjzh6lgfpqeurhyx      # k3 (192.168.23.19)
