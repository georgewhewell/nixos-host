  - &nanokvm age1ua7ak0vzvw24tcqkunpsjl3vmcjsvqsneem2e0x94mqd3re2p4sqfgt80n  # nanokvm

  # Darwin machine age keys (from SSH host keys)
  - &air age1huqmde9sgsl3vlf87l9c8874caa7vezjutq4vjx9e2wey62zlfgqq468u3                                    # air (macbook air)
  - &mbp age1huqmde9sgsl3vlf87l9c8874caa7vezjutq4vjx9e2wey62zlfgqq468u3                                    # mbp (macbook pro)

  # Your GPG key for editing
  - &grw_gpg 4ED64FA5BBF73612035B86B20C414B6F2BA7BB19  # George Whewell

creation_rules:
  # Crypto services - trex and router (merge mining)
  - path_regex: secrets/crypto\.yaml$
    key_groups:
      - age:
          - *trex
          - *router
        pgp:
          - *grw_gpg

  # GitHub runners - trex only
  - path_regex: secrets/github-runners\.yaml$
    key_groups:
      - age:
          - *trex
        pgp:
          - *grw_gpg

  # Media services (Arr stack) - trex only
  - path_regex: secrets/media\.yaml$
    key_groups:
      - age:
          - *trex
        pgp:
          - *grw_gpg

  # ACME DNS-01 credentials (GCP ADC for internal-only certs) - trex only
  - path_regex: secrets/acme\.yaml$
    key_groups:
      - age:
          - *trex
        pgp:
          - *grw_gpg

  # Monitoring (Grafana) - trex only
  - path_regex: secrets/monitoring\.yaml$
    key_groups:
      - age:
          - *trex
        pgp:
          - *grw_gpg

  # Home automation (MQTT) - router + MQTT-controlled hosts
  - path_regex: secrets/home-automation\.yaml$
    key_groups:
      - age:
          - *router
          - *fuckup
          - *trex
          - *strix-1
          - *strix-2
          - *strix-3
          - *strix-4
          - *rock-5b
          - *prime
          - *neo2
        pgp:
          - *grw_gpg

  # BeeGFS cluster connection auth - mgmtd on BlueField-2,
  # meta/storage/clients on trex and the strix nodes.
  - path_regex: secrets/beegfs\.yaml$
    key_groups:
      - age:
          - *router
          - *bluefield2
          - *trex
          - *strix-1
          - *strix-2
          - *strix-3
          - *strix-4
        pgp:
          - *grw_gpg

  # WiFi password - router and WiFi-enabled machines
  - path_regex: secrets/iphone-hotspot\.yaml$
    key_groups:
      - age:
          - *k3
        pgp:
          - *grw_gpg

  # Rescue WireGuard tunnel: k3 dials out to ax102 so the LAN stays reachable
  # when the ISP link, the BlueField gateway, or the .31 service host is down.
  # k3 only -- no other host holds this identity.
  - path_regex: secrets/wireguard-rescue\.yaml$
    key_groups:
      - age:
          - *k3
        pgp:
          - *grw_gpg

  - path_regex: secrets/wifi\.yaml$
    key_groups:
      - age:
          - *router
          - *fuckup
          - *strix-1
          - *strix-2
          - *rock-5b
          - *k3
          - *prime
          - *nanokvm
        pgp:
          - *grw_gpg

  # ESPHome device credentials (API/OTA/web auth) and shared substitutions.
  # Router decrypts these at activation to populate the ESPHome dashboard's
  # secrets.yaml; GPG is kept for local authoring/wrapping via the CLI.
  - path_regex: secrets/esphome\.yaml$
    key_groups:
      - age:
          - *router
        pgp:
          - *grw_gpg

  # WireGuard VPN - router (server) and clients
  - path_regex: secrets/wireguard\.yaml$
    key_groups:
      - age:
          - *router
        pgp:
          - *grw_gpg

  # Hellas executor secrets (HF_TOKEN) - trex + fuckup
  - path_regex: secrets/hellas\.yaml$
    key_groups:
      - age:
          - *trex
          - *fuckup
        pgp:
          - *grw_gpg

  # nix-daemon path-signing key + nix-serve key. trex is the only signer;
  # other hosts trust the corresponding public key via nix.settings in
  # modules/nix.nix.
  - path_regex: secrets/nix\.yaml$
    key_groups:
      - age:
          - *trex
        pgp:
          - *grw_gpg

  # SSH host keys - GPG only (for bootstrapping new installs)
  - path_regex: secrets/ssh-host-keys\.yaml$
    key_groups:
      - pgp:
          - *grw_gpg
